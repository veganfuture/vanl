# No [server] section: the listen address is controlled by the standard
# PORT/HOST environment variables (nitro's convention), not this file.

[site]
base_url = "http://localhost:3000"

[logging]
level = "debug"

[database]
host = "127.0.0.1"
# Placeholder only - the real dev Postgres port is derived per-checkout (see
# flake.nix's `repo-db-port`) and injected via the VANL_DB_PORT env var by
# `nix run .#dev`/`.#check`, which overrides this value (src/lib/config.ts).
# This number only applies if you bypass both of those and run e.g. `bun run
# dev` directly without VANL_DB_PORT set.
port = 54329
database = "vanl_dev"
user = "vanl"

[auth]
bot_api_base_url = "http://127.0.0.1:8787"
# Dev-only keypair, safe to share — never use in production. Generate a real
# one with `nix run ./bot#generate-signup-key`. Matching private key seed for
# local end-to-end testing (export as VANL_SIGNUP_PRIVATE_KEY on the bot):
# Psjl9VLCqVz3Hhw6zS-wfsLt6phUctNibo_bkT9ycV8
signup_public_key = "afQIoPf6trsqUYAvCUNebfnEdApb1JHnoM_Q0JIHBBE"
